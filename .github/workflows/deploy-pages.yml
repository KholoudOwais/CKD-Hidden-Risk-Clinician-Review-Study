name: Deploy clinician review site

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Make framework assets compatible with GitHub Pages
        run: |
          mv dist/client/CKD-Hidden-Risk-Clinician-Review-Study/_next dist/client/next-assets
          rm -rf dist/client/CKD-Hidden-Risk-Clinician-Review-Study
          find dist/client -type f \( -name '*.html' -o -name '*.rsc' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '_headers' \) -print0 | xargs -0 sed -i 's|/CKD-Hidden-Risk-Clinician-Review-Study/_next/|/CKD-Hidden-Risk-Clinician-Review-Study/next-assets/|g'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
